<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" width="720" height="150" role="img" aria-label="Düşüp kalkan, her seferinde daha yükseğe çıkan bir çizgi">
  <title>Düşüp kalkan, her seferinde daha yükseğe çıkan bir çizgi</title>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="23" y1="0" x2="693" y2="0">
      <stop offset="0" stop-color="#d2d2d7"/>
      <stop offset="0.55" stop-color="#86868b"/>
      <stop offset="1" stop-color="#1d1d1f"/>
    </linearGradient>
  </defs>
  <style>
    .cizgi { stroke-dasharray: 1 2; stroke-dashoffset: 0; animation: ciz 2.6s cubic-bezier(.45,0,.2,1) .3s both; }
    .nokta { transform-box: fill-box; transform-origin: center; animation: belir .4s cubic-bezier(.2,.9,.3,1.3) 2.75s both; }
    .hale  { opacity: 0; transform-box: fill-box; transform-origin: center; animation: hale 1.4s cubic-bezier(.2,.7,.3,1) 2.9s forwards; }
    @keyframes ciz   { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes belir { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
    @keyframes hale  { from { opacity: .5; transform: scale(1); } to { opacity: 0; transform: scale(3.6); } }
    @media (prefers-reduced-motion: reduce) { .cizgi, .nokta, .hale { animation: none; } }
  </style>
  <line x1="23" y1="98" x2="693" y2="98" stroke="#d2d2d7" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="0.1 7" />
  <path class="cizgi" d="M23 98 C69 98 69 76 115 76 C148 76 148 110 181 110 C233 110 233 58 285 58 C331 58 331 124 377 124 C436 124 436 38 495 38 C527 38 527 68 559 68 C626 68 626 22 693 22" pathLength="1" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="hale" cx="693" cy="22" r="5" fill="none" stroke="#0071e3" stroke-width="1.5"/>
  <circle class="nokta" cx="693" cy="22" r="5.5" fill="#0071e3"/>
</svg>
